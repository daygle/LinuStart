version: 2

updates:
  # Python: the panel itself plus the dev tooling. pip and setuptools get
  # weekly churn; the web stack is pinned to the major.
  #
  # Only ecosystems that exist are listed here: the panel has no JavaScript
  # manifest (Node is used by CI to lint and test the static files, nothing
  # is installed from a package.json), and Dependabot has no package
  # ecosystem for Debian packages, so an apt watcher could never open a
  # pull request.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Every group needs at least one of patterns, dependency-type or
      # update-types, or Dependabot rejects the whole file.
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
      pip-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "setuptools"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
