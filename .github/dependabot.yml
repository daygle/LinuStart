version: 2

updates:
  # Python: the panel itself plus the dev tooling. pip and setuptools get
  # weekly churn; the web stack is pinned to the major.
  #
  # Only ecosystems that exist are listed here: the panel has no JavaScript
  # manifest (Node is used by CI to lint and test the static files, nothing
  # is installed from a package.json), and Dependabot has no package
  # ecosystem for Debian packages, so an apt watcher could never open a
  # pull request.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-security:
        applies-to: security-updates
        update-types:
          - "patch"
      pip-minor-and-major:
        applies-to: "version-updates"
        exclude-patterns: []
    ignore:
      - dependency-name: "setuptools"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
