name: Release assets

# Attaches a reproducible archive and its SHA-256 to every published release.
# The panel's self-updater and install.sh prefer this archive and refuse it
# when the checksum does not match; GitHub's on-the-fly source tarballs are
# not guaranteed to be byte-stable, so they cannot carry a checksum.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build assets for"
        required: true

permissions:
  contents: write  # uploading release assets

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # The same pattern the updater accepts; nothing else reaches a shell.
          if ! [[ "$RELEASE_TAG" =~ ^v?[0-9]{1,4}(\.[0-9]{1,4}){0,3}([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "refusing unexpected tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1

      # The tag is the version: nobody edits linustart/__init__.py to cut a
      # release, so stamp the tag into the archive here. The archive is built
      # from the index (git write-tree) so it carries the stamp and nothing
      # else from the runner, with the tagged commit's time as every file's
      # mtime so a rebuild of the same tag is byte-identical.
      - name: Build the archive and SHA256SUMS
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="${TAG#[vV]}"
          sed -i "s/^__version__ = \".*\"/__version__ = \"${version}\"/" linustart/__init__.py
          grep -qx "__version__ = \"${version}\"" linustart/__init__.py || {
            echo "could not stamp version ${version} into linustart/__init__.py" >&2
            exit 1
          }
          git add linustart/__init__.py
          tree="$(git write-tree)"
          name="linustart-${TAG}.tar.gz"
          git archive --format=tar --prefix="linustart-${TAG}/" \
            --mtime="$(git log -1 --format=%cI HEAD)" "$tree" | gzip -n -9 > "$name"
          sha256sum "$name" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" "linustart-${TAG}.tar.gz" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
