name: Release assets

# Attaches a reproducible archive and its SHA-256 to every published release.
# The panel's self-updater and install.sh prefer this archive and refuse it
# when the checksum does not match; GitHub's on-the-fly source tarballs are
# not guaranteed to be byte-stable, so they cannot carry a checksum.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build assets for"
        required: true

permissions:
  contents: write  # uploading release assets

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # The same pattern the updater accepts; nothing else reaches a shell.
          if ! [[ "$RELEASE_TAG" =~ ^v?[0-9]{1,4}(\.[0-9]{1,4}){0,3}([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "refusing unexpected tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1

      # A tag whose code still declares the previous version is refused by
      # every installed panel (v1.0.1 and v1.0.2 shipped declaring 1.0.0).
      # Fail here, before any asset is attached, so the mistake is visible.
      - name: Check the tag matches the declared version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          declared="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' linustart/__init__.py | head -n1)"
          project="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pyproject.toml | head -n1)"
          if [ "${TAG#[vV]}" != "$declared" ] || [ "$declared" != "$project" ]; then
            echo "tag $TAG does not match linustart/__init__.py ($declared) and pyproject.toml ($project)" >&2
            echo "bump both, commit, and tag that commit" >&2
            exit 1
          fi

      - name: Build the archive and SHA256SUMS
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          name="linustart-${TAG}.tar.gz"
          git archive --format=tar --prefix="linustart-${TAG}/" HEAD | gzip -n -9 > "$name"
          sha256sum "$name" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" "linustart-${TAG}.tar.gz" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
