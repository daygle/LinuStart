name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The panel is a Python/Javascript project: the OS checks are the gates.
# Debian/Ubuntu is the target, and the interpreter of record is the venv's
# python (system python has broken pydantic, so system python must never
# run this suite). The runner is Linux, so the venv interpreter lives in
# .venv/bin - a Windows checkout's .venv/Scripts/python is not a thing here.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the venv (like install.sh cares about it)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip setuptools wheel
          .venv/bin/python -m pip install -e .[dev]

      - name: Install the OS checks so the panel tests are meaningful
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 cron unattended-upgrades

      - name: Run the suite the same way a developer does
        run: |
          .venv/bin/python -m pytest -q

      # Static checks are cheap and fast - they run on the current commit
      # regardless of what the tests do next to it.
      - name: Check the frontend JavaScript
        run: node --check linustart/static/app.js

      - name: Check the installer shell script
        run: bash -n install.sh

      - name: Confirm the installed package actually imports
        run: |
          .venv/bin/python -c "import linustart.updater, linustart.modules.cron, linustart.modules.sysctl; print('imports ok')"

  # The shell always returns the status of the last command in the pipeline,
  # so a failing earlier step is reported here as a failing gate.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: Confirm the gate
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "CI failed: the test and static-check steps above did not pass"
            exit 1
          fi
          echo "OK: tests and static checks passed"
