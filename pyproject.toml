[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linustart"
# The version lives in linustart/__init__.py only, and releases stamp it from
# the tag (see .github/workflows/release.yml): nobody edits it by hand.
dynamic = ["version"]
description = "Self-hosted web panel for Debian and Ubuntu server administration: networking, unattended updates, hostname, timezone and APT package management."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",  # WebSocket support for the web terminal (uvicorn ws protocol)
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
linustart = "linustart.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "linustart.__version__" }

[tool.setuptools.packages.find]
include = ["linustart*"]

[tool.setuptools.package-data]
linustart = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py39"
extend-exclude = ["linustart/static"]

[tool.ruff.lint]
# pycodestyle, pyflakes, warnings and bugbear. The typing-modernisation rules
# (UP) are left out on purpose: the code keeps Python 3.9-compatible typing.
select = ["E", "F", "W", "B"]
ignore = ["B904"]  # `raise ... from` inside except: style, not a bug here
