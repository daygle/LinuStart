[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linustart"
version = "0.1.0"
description = "Self-hosted web panel for Debian and Ubuntu server administration: networking, unattended updates, hostname, timezone and APT package management."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
linustart = "linustart.__main__:main"

[tool.setuptools.packages.find]
include = ["linustart*"]

[tool.setuptools.package-data]
linustart = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
